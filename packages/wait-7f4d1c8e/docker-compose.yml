services:
  workflow:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      # Application Default Credentials from the host, so Vertex AI works
      # locally without a service account key. Run once on the host:
      #   gcloud auth application-default login
      GOOGLE_APPLICATION_CREDENTIALS: /home/agent/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud:/home/agent/.config/gcloud:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
